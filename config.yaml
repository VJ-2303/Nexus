listen_addr: ":8080"
balancer: "roundrobin"
log_level: "info"

backends:
  - url: "http://localhost:8081"
    weight: 1
  - url: "http://localhost:8082"
    weight: 2

health:
  interval: 10s
  timeout: 5s
  pass_threshold: 2
  fail_threshold: 3

transport:
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  max_conns_per_host: 50
  idle_conn_timeout: 90s
  response_timeout: 30s
